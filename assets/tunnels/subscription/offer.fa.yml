page_title: اشتراک
title: 'پیشنهاد خود را انتخاب کنید'
lead: 'دو پیشنهاد و یک مسیر متفاوت برای هر کدام: پیشنهاد پرو از طریق پرداختی می‌گذرد که پیشنهاد رایگان هرگز آن را نمی‌بیند.'
offer:
  free:
    title: رایگان
    description: 'یک حساب، بدون هزینه. دو مرحله و شما وارد می‌شوید.'
  paid:
    title: پرو
    description: 'یک حساب و یک پرداخت، که قبل از ورود شما توسط بانک تأیید می‌شود.'
behind: 'نقطه ورود. هر کارت به یک نشانگر از مرحله حساب که پیشنهاد را به عنوان گزینه حمل می‌کند، منتهی می‌شود و مرحله حساب آن گزینه را می‌خواند تا آنچه را که بعد از آن می‌آید انتخاب کند: پرداخت برای پرو، هیچ چیزی برای رایگان. دو شاخه شکل یکسانی ندارند، به همین دلیل است که نشانگر فاصله‌ای پس از مرحله حساب نشان می‌دهد: تا زمانی که انتخاب نکنید، هیچ‌کس نمی‌تواند بگوید چند مرحله باقی مانده است.'
