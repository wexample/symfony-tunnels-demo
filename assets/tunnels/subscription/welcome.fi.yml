  title: 'Tulemasi reitti'
behind: 'Molemmat haarat päättyvät tänne, kukin omalla osoittimellaan, ja sen näyttäminen sulkee istunnon. Alla oleva reitti on kaksi askelta pidempi Pro-haarassa: puu kasvoi haaran, jossa tarjous sitä vaati.'
