page_title: 구독
page_icon: 'ph:bold/credit-card'
intro: '두 가지 제안이 있는 구독입니다. 무료 제안은 계정 하나뿐이며, Pro 제안은 결제를 추가하며, 데모가 진행되는 동안 은행에서 확인됩니다.'
start: '무료는 세 단계, Pro는 다섯 단계입니다. 각 단계는 고유의 페이지에서 진행되며, 아래에서 엔진이 방금 수행한 작업을 설명합니다.'
roads:
  description: '계정 단계는 커서가 지닌 제안을 읽고 다음에 무엇이 올지를 결정합니다: Pro는 결제가 필요하고, Free는 필요하지 않습니다. 두 길은 길이가 다릅니다.'
  free: 무료
  paid: Pro
steps:
  offer: '여기서 두 길이 갈라지며, 같은 형태가 아닙니다: 제안이 선택될 때까지 스테퍼는 둘의 차이를 보여주는 간격을 나타냅니다.'
  account: '두 길 모두 같은 형태입니다. 커서는 제안을 지니고 있으며, 단계는 이를 읽어 다음에 무엇이 올지를 결정합니다.'
  payment: 'Pro 길에서만 해당됩니다. 표시되는 동안 세션은 15분 후에 만료되며, 예약된 좌석과 같습니다; 결제가 완료되면 이전 단계는 다시 접근할 수 없으며, 두 번 제공되지 않습니다.'
  waiting: '세션이 은행에서 대기 중입니다. 데모의 버튼은 웹훅을 작동시켜 세션을 TunnelResumeService를 통해 재개합니다.'
  welcome: '두 길 모두 여기에서 끝나며, 각기 고유의 커서를 통해 세션이 종료됩니다.'
