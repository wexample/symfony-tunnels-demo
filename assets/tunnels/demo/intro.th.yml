page_title: เดโมอุโมงค์
title: ยินดีต้อนรับ
lead: 'อุโมงค์สั้น ๆ เพื่อแสดงให้เห็นว่าการอ่านทำอย่างไร: เลือกแผน, ตั้งชื่อ, และเสร็จสิ้น. แผนที่คุณเลือกจะกำหนดขั้นตอนถัดไป.'
plan:
  free:
    description: 'ทุกอย่างที่ต้องเริ่มต้น, ไม่มีค่าใช้จ่าย.'
  paid:
    description: 'ทั้งหมดของมัน, พร้อมกับพื้นที่ในการเติบโต.'
behind: 'จุดเข้าอุโมงค์. การเปิดใช้งานสร้างเซสชันในฐานข้อมูล, ซึ่งเบราว์เซอร์เซสชันรู้จักเฉพาะโดย id. ขั้นตอนนี้จะเสร็จสิ้นทันทีที่แสดง, ตามค่าเริ่มต้น. การ์ดทั้งสองนำไปสู่ตัวชี้สองตัวของขั้นตอนถัดไปเดียวกัน, แยกแยะด้วยตัวเลือกแผน: ส่วนต้นไม้ที่นี่, ดังนั้นจึงไม่มีปุ่มถัดไป, และตัวจัดการขั้นตอนตั้งชื่อขั้นตอนที่ 2 หลังจากขั้นตอนแทนที่จะเป็นหลังจากแผน.'
