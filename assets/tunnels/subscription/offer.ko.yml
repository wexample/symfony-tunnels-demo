page_title: 구독
title: '제안을 선택하세요'
lead: '두 가지 제안이 있으며, 각각 다른 경로가 있습니다: 유료는 결제를 거치고 무료는 결제를 보지 않습니다.'
offer:
  free:
    title: 무료
    description: '계정, 지불할 필요 없음. 두 단계로 시작할 수 있습니다.'
  paid:
    title: 프로
    description: '계정과 결제, 입장하기 전에 은행에서 확인됩니다.'
behind: '진입점. 각 카드는 제안으로서의 옵션을 가진 계정 단계의 커서로 이어지며, 계정 단계는 다음을 선택하기 위해 그 옵션을 읽습니다: 프로는 결제, 무료는 아무것도 없습니다. 두 가지 가지는 모양이 다르기 때문에 스텝퍼에서 계정 후에 간격이 표시됩니다: 선택하기 전까지는 남은 단계가 몇 개인지 아무도 알 수 없습니다.'
