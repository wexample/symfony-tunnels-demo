page_title: 'ডেমো টানেল'
title: 'আপনার পরিকল্পনা'
lead:
  free: 'ফ্রি প্ল্যান: শুরু করার জন্য সবকিছু, কোনো টাকা দিতে হবে না।'
  paid: 'পেইড প্ল্যান: এর পুরো অংশ, বাড়ানোর জন্য স্থান সহ।'
note:
  title: 'দুই শাখা, এক পথ'
  body: 'এই পদক্ষেপটি প্রতি পরিকল্পনার জন্য একবারই থাকে। পূর্ববর্তী আপনাকে নির্বাচনে ফিরিয়ে নিয়ে যায়; পরবর্তী আপনাকে সেই একই ফর্মে নিয়ে যায়, আপনি কোন পরিকল্পনা বেছে নিয়েছেন।'
behind: 'পরিকল্পনা পদক্ষেপের দুটি কার্সারের মধ্যে একটি, যেটি পরিকল্পনা %plan% বহন করে। প্রতিটি কার্সারের নিজস্ব হ্যাশ রয়েছে, তাই একটি যা সঞ্চয় করে তা অন্যটির থেকে কখনো দেখা যায় না। এই পদক্ষেপের পরবর্তী প্রতিটি পদক্ষেপও দুটি করে থাকে, প্রতিটি কার্সারের নিচে একটি কপি: শাখাগুলি আবার মিলিত হতে মনে হয়, তবে আপনি যে ফর্ম এবং ক্লোজিং পৃষ্ঠায় পৌঁছান তা আপনার পরিকল্পনার।'
