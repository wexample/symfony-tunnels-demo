page_title: Berlangganan
page_icon: 'ph:bold/credit-card'
intro: 'Sebuah langganan dengan dua tawaran. Yang gratis adalah akun dan tidak lebih; yang Pro menambahkan pembayaran, dikonfirmasi oleh bank yang dimainkan demo.'
start: 'Tiga langkah untuk Gratis, lima untuk Pro. Setiap langkah memiliki halaman sendiri, masing-masing menjelaskan di bawah apa yang baru saja dilakukan mesin.'
roads:
  description: 'Langkah akun membaca tawaran yang dibawa kursor untuk memutuskan apa yang terjadi selanjutnya: pembayaran untuk Pro, tidak ada untuk Gratis. Dua jalan ini tidak memiliki panjang yang sama.'
  free: Gratis
  paid: Pro
steps:
  offer: 'Jalan terpisah di sini, dan tidak dalam bentuk yang sama: sampai tawaran dipilih, langkah menunjukkan celah di mana mereka berbeda.'
  account: 'Bentuk yang sama di kedua jalan. Kursor membawa tawaran, dan langkah membaca untuk memutuskan apa yang terjadi selanjutnya.'
  payment: 'Hanya di jalan Pro. Sementara itu ditampilkan, sesi akan kedaluwarsa dalam 15 menit, seperti kursi yang dipesan; setelah dibayar, tidak ada yang bisa dijangkau lagi sebelum itu, dan tidak pernah ditawarkan dua kali.'
  waiting: 'Sesi menunggu di bank. Sebuah tombol demo memainkan webhook-nya, yang melanjutkan sesi melalui TunnelResumeService.'
  welcome: 'Kedua jalan berakhir di sini, masing-masing melalui kursor miliknya sendiri, dan sesi ditutup.'
