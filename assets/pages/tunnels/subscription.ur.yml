page_title: 'سبسکرائب کریں'
page_icon: 'ph:bold/credit-card'
intro: 'دو پیشکشوں کے ساتھ ایک سبسکرپشن۔ مفت والا ایک اکاؤنٹ ہے اور بس؛ پرو والا ایک ادائیگی شامل کرتا ہے، جس کی تصدیق ایک بینک کرتا ہے جیسا کہ ڈیمو میں دکھایا گیا ہے۔'
start: 'مفت کے لیے تین مراحل، پرو کے لیے پانچ۔ ہر ایک کا اپنا صفحہ ہے، ہر ایک نیچے بتاتا ہے کہ انجن نے ابھی کیا کیا۔'
roads:
  description: 'اکاؤنٹ کا مرحلہ اس پیشکش کو پڑھتا ہے جو اس کے کرسر کے پاس ہے تاکہ یہ طے کرے کہ کیا آگے بڑھنا ہے: پرو کے لیے ایک ادائیگی، مفت کے لیے کچھ نہیں۔ دونوں راستے ایک جیسے لمبائی کے نہیں ہیں۔'
  free: مفت
  paid: پرو
steps:
  offer: 'یہاں راستے الگ ہوتے ہیں، اور ایک ہی شکل میں نہیں: جب تک ایک پیشکش منتخب نہ کی جائے، اسٹیپر ایک خلا دکھاتا ہے جہاں وہ مختلف ہیں۔'
  account: 'دونوں راستوں پر یہی فارم ہے۔ اس کا کرسر پیشکش کو لے کر آتا ہے، اور مرحلہ اسے پڑھتا ہے تاکہ یہ طے کرے کہ کیا آگے بڑھنا ہے۔'
  payment: 'صرف پرو راستے پر۔ جب یہ دکھائی دیتا ہے، تو سیشن 15 منٹ میں ختم ہو جاتا ہے، جیسے ایک محفوظ نشست؛ ایک بار ادا کرنے کے بعد، اس سے پہلے کچھ دوبارہ نہیں پہنچا جا سکتا، اور یہ کبھی دو بار پیش نہیں کیا جاتا۔'
  waiting: 'سیشن بینک پر انتظار کر رہا ہے۔ ڈیمو کا ایک بٹن اس کا ویب ہک چلاتا ہے، جو سیشن کو TunnelResumeService کے ذریعے دوبارہ شروع کرتا ہے۔'
  welcome: 'دونوں راستے یہاں ختم ہوتے ہیں، ہر ایک اپنے اپنے کرسر کے ذریعے، اور سیشن بند ہو جاتا ہے۔'
