page_title: 'Демо туннель'
title: 'Добро пожаловать'
lead: 'Короткий туннель, чтобы показать, как это работает: выберите план, дайте ему имя, и все готово. Выбранный вами план определяет следующий шаг.'
plan:
  free:
    description: 'Все, чтобы начать, ничего платить не нужно.'
  paid:
    description: 'Полный доступ, с возможностью роста.'
behind: 'Входная точка туннеля. Открытие создало сессию в базе данных, которую браузерская сессия знает только по её идентификатору. Этот шаг завершается, как только он отображается, по умолчанию. Две карточки ведут к двум курсорам одного и того же следующего шага, различающимся по опции плана: здесь дерево разветвляется, поэтому нет кнопки «Далее», а шагомер называет шаг 2 после шага, а не после плана.'
