page_title: টানেল
page_icon: 'ph:bold/path'
intro: 'একটি টানেল হচ্ছে ধাপে ধাপে ভ্রমণ — একটি সাইন-আপ, একটি চেকআউট, একটি নবায়ন — যার পথ ভিজিটরের উত্তর দেওয়ার সাথে সাথে পরিবর্তিত হতে পারে। প্যাকেজটি মনে রাখে প্রতিটি ভিজিটর কোথায় অবস্থান করছে, তাদের জন্য যে ধাপগুলি দেখা যায় সেগুলোর মাধ্যমে যেতে দেয়, এবং তারা যখন অগ্রসর হওয়ার চেষ্টা করে তখন তাদের প্রাপ্য স্থানে ফিরিয়ে দেয়।'
card:
  plan:
    title: 'একটি পরিকল্পনা নির্বাচন করুন'
    description: 'প্রথম টানেল: দুটি শাখা, একটি ফর্ম, এবং শেষে একটি সেশন বন্ধ।'
  subscription:
    title: 'সাবস্ক্রাইব করুন'
    description: 'একটি শাখায় শুধুমাত্র একটি পেমেন্ট, 15 মিনিট ধরে একটি সেশন, ব্যাংকে অপেক্ষা।'
tree:
  title: 'কার্সরের একটি গাছ'
  body: 'একটি টানেল একটি তালিকা নয়, গাছ হিসেবে তৈরি হয়। দুটি স্থানে পৌঁছানো একটি ধাপ দুটি কার্সর, প্রতিটির নিজস্ব হ্যাশ এবং সংরক্ষিত মান রয়েছে: এটি একটি শাখাকে এমন ধাপ বাড়াতে দেয় যা অন্যটির নেই, এবং যে পথ দিয়ে আপনি এসেছেন, সেটি প্রত্যেক টানেলের শেষে পড়া হয়।'
session:
  title: 'ডেটাবেসে একটি সেশন'
  body: 'একটি টানেল খোলার মাধ্যমে একটি সেশন তৈরি হয়, যা ব্রাউজার সেশন কেবল তার আইডি দ্বারা জানে। এটি সেই মানগুলি ধারণ করে যা ধাপগুলি সংরক্ষণ করে, এবং শেষ প্রদর্শিত ধাপের এক দিন পরে মেয়াদ শেষ হয় — অথবা তাড়াতাড়ি, যখন সেই ধাপটি তার জন্য অনুরোধ করে। মেয়াদ শেষ হওয়া সেশনগুলি শিডিউলার দ্বারা 15 মিনিটে বাদ দেওয়া হয়; সম্পন্ন এবং মুলতুবি সেশনগুলি রাখা হয়।'
access:
  title: 'ভিজিটর কোথায় যেতে পারে'
  body: 'প্রতিটি ধাপ নির্ধারণ করে যে এটি প্রদর্শিত হতে পারে কি না এবং অন্যথায় ভিজিটরকে কোথায় পাঠাতে হবে। লিঙ্ক এবং বোতাম একই নিয়মে অঙ্কিত হয়, তাই একটি লিঙ্ক কখনও রিডাইরেক্টের দিকে নিয়ে যায় না: যেখানে পথ বিভক্ত হয় সেখানে পরবর্তী বোতাম নেই, একটি পেমেন্টের পর ফিরে যাওয়ার উপায় নেই, বন্ধ সেশনে ফিরে যাওয়ার কিছু নেই।'
look:
  title: 'হাঁটার সময় কী দেখতে হবে'
  stepper:
    title: স্টেপার
    body: 'আপনি কোথায় আছেন, পেছনে কী আছে, সামনে কী আছে। একটি ফাঁকা চিহ্নিত করে যেখানে পথ একটি নির্বাচন না করা অনুযায়ী নির্ভর করে।'
  behind:
    title: 'এই ধাপের পেছনে'
    body: 'প্রতিটি ধাপের নিচে, ইঞ্জিনটি ঠিক কী করেছে, এবং এর অবস্থা: কার্সর, ধাপটি কীভাবে সম্পন্ন হয়, সেশন এবং এটি কখন মেয়াদ শেষ হয়।'
  toolbar:
    title: 'ডেভেলপ টুলবার এবং শেল'
    body: 'ডেভেলপ টুলবারের টানেল ট্যাব এই ব্রাউজারের সেশনকে তার টানেলের মানচিত্রে অঙ্কিত করে; bin/console tunnels:info শেলের মাধ্যমে একই কাজ করে।'
