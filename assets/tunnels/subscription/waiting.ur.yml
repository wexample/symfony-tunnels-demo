page_title: سبسکرپشن
title: 'بینک کا انتظار'
lead: 'ادائیگی %reference% بھیج دی گئی ہے۔ بینک اپنی مرضی سے اس کی تصدیق کرے گا۔'
note:
  title: 'آپ اس صفحے کو چھوڑ سکتے ہیں'
  body: 'آپ کی ادائیگی محفوظ ہے چاہے آپ کچھ بھی کریں: بعد میں واپس آئیں، اور آپ کو بینک کے جواب ملنے پر دوبارہ داخل ہونے کی اجازت دی جائے گی۔'
behind: 'سیشن pending_async_action پر ہے: کوئی بھی ٹنل کے ذریعے چلنے والا اس قدم کو مکمل نہیں کر سکتا، صرف بینک ہی کر سکتا ہے۔ ایک حقیقی ایپلیکیشن اپنے جواب کو webhook پر وصول کرتی ہے اور حوالہ TunnelResumeService کو دے دیتی ہے، جو انتظار کرنے والے سیشن کی ٹنل کو دوبارہ تعمیر کرتی ہے اور اس قدم کو مکمل کرتی ہے؛ دوبارہ دکھایا گیا، یہ قدم زائر کو خود بخود آگے بڑھاتا ہے۔ نیچے کا بٹن بینک کو چلاتا ہے۔ زیر انتظار سیشن کبھی ختم نہیں ہوتے، اور ادائیگی سے پہلے کچھ بھی اب مزید منسلک نہیں ہے۔'
simulate: 'بینک چلائیں: ادائیگی کی تصدیق کریں'
