page_title: 'اختر خطة'
page_icon: 'ph:bold/signpost'
intro: 'النفق الأول، صغير بما يكفي ليقرأ ككل: ترحيب، خطة لاختيار، اسم لإعطائه، وهكذا يتم الأمر.'
start: 'أربع خطوات. تظهر في صفحة خاصة بها، كل واحدة تخبر أدناه بما فعله المحرك للتو.'
roads:
  description: 'تم الوصول إلى خطوة الخطة مرتين، مرة لكل خطة، وكذلك كل شيء بعدها: مؤشرين من نفس الخطوة، كل منهما يحتفظ بقيمه الخاصة.'
  free: 'خطة مجانية'
  paid: 'خطة مدفوعة'
steps:
  intro: 'الأجزاء هنا: بطاقتان، واحدة لكل خطة، ولا يوجد زر التالي. حتى يتم اختيار خطة، تسمي الخطوة 2 بعد الخطوة، وليس بعد خطة.'
  plan: 'مؤشرين من نفس الخطوة، يتم تمييزهما بالخطة التي يحملانها، كل منهما يحتفظ بقيمه المخزنة الخاصة به.'
  confirm: 'خطوة نموذج، تتم فقط عندما يكون النموذج صالحًا؛ زر التالي في النفق يقدمه. عد واسمها لا يزال هناك؛ ارجع قبلها وستُحذف، لذا فإن الفرع الذي تم السير فيه مرة أخرى يبدأ نظيفًا.'
  done: 'يغلق الجلسة: لا شيء قبله مرتبط بعد الآن، وفتح النفق مرة أخرى يبدأ واحدة جديدة.'
