page_title: Abbonati
page_icon: 'ph:bold/credit-card'
intro: "Un abbonamento con due offerte. Quella gratuita è un account e nient'altro; quella Pro aggiunge un pagamento, confermato da una banca mentre il demo viene eseguito."
start: 'Tre passaggi per la versione gratuita, cinque per la Pro. Ognuno ha una pagina dedicata, e ciascuno spiega di seguito cosa ha appena fatto il motore.'
roads:
  description: "Il passaggio dell'account legge l'offerta che il suo cursore porta per decidere cosa segue: un pagamento per la Pro, nulla per la gratuita. I due percorsi non hanno la stessa lunghezza."
  free: Gratuito
  paid: Pro
steps:
  offer: "I percorsi si dividono qui, e non nella stessa forma: fino a quando non viene selezionata un'offerta, il selettore mostra un divario dove differiscono."
  account: "La stessa forma su entrambi i percorsi. Il suo cursore porta l'offerta, e il passaggio la legge per decidere cosa segue."
  payment: 'Solo sul percorso Pro. Mentre è mostrato, la sessione scade in 15 minuti, come un posto riservato; una volta pagato, nulla prima può essere raggiunto di nuovo, e non viene mai offerto due volte.'
  waiting: 'La sessione attende la banca. Un pulsante del demo attiva il suo webhook, che riprende la sessione tramite TunnelResumeService.'
  welcome: 'Entrambi i percorsi finiscono qui, ciascuno attraverso un cursore di proprietà, e la sessione è chiusa.'
