page_title: Subscription
title: Choose your offer
lead: "Two offers, and a different road for each: the Pro one goes through a payment the free one never sees."
offer:
  free:
    title: Free
    description: An account, nothing to pay. Two steps and you are in.
  paid:
    title: Pro
    description: An account and a payment, confirmed by the bank before you get in.
behind: "The entrypoint. Each card leads to a cursor of the account step carrying the offer as an option, and the account step reads that option to pick what follows: a payment for Pro, nothing for Free. The two branches are not the same shape, which is why the stepper shows a gap after the account: until you choose, nobody can tell how many steps are left."
