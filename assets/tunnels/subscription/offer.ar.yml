page_title: الاشتراك
title: 'اختر عرضك'
lead: 'عرضان، وطريق مختلف لكل منهما: العرض الاحترافي يتطلب الدفع بينما العرض المجاني لا يتطلب شيئاً.'
offer:
  free:
    title: مجاني
    description: 'حساب، لا يوجد ما يدفع. خطوتان وستكون داخل.'
  paid:
    title: احترافي
    description: 'حساب ودفع، يتم تأكيده من قبل البنك قبل الدخول.'
behind: 'نقطة الدخول. كل بطاقة تقود إلى مؤشر خطوة الحساب الذي يحمل العرض كخيار، وخطوة الحساب تقرأ ذلك الخيار لتحديد ما يلي: دفع للاحترافي، لا شيء للمجاني. الفرعان ليسا بنفس الشكل، ولهذا السبب يظهر الفاصل بعد الحساب: حتى تختار، لا يمكن لأحد أن يخبرك بعدد الخطوات المتبقية.'
