page_title: 订阅
title: 选择您的优惠
lead: 两个优惠，各走不同的路：专业版需要支付，免费版则不需要。
offer:
  free:
    title: 免费
    description: 一个账户，无需支付。两步即可完成注册。
  paid:
    title: 专业版
    description: 一个账户和一笔支付，需在进入之前经过银行确认。
behind: 入口。每张卡片指向一个账户步骤的游标，该步骤将优惠作为选项，而账户步骤读取该选项以决定接下来的内容：专业版需要支付，免费版则无需。两个分支形状不同，这就是为什么在账户之后，步骤指示器会显示出一个间隔：在您选择之前，没有人能知道还剩多少步骤。
