page_title: সাবস্ক্রিপশন
title: স্বাগতম
lead:
  free: 'আপনার ফ্রি অ্যাকাউন্ট প্রস্তুত।'
  paid: 'পেমেন্ট নিশ্চিত হয়েছে, আপনার প্রো অ্যাকাউন্ট প্রস্তুত।'
path:
  title: 'আপনি যে পথে এসেছেন'
behind: 'দুটি শাখাই এখানে শেষ হচ্ছে, প্রতিটির নিজস্ব কर्सরের মাধ্যমে, এবং এটি প্রদর্শন করলে সেশন বন্ধ হয়ে যাবে। নিচের পথ প্রো শাখায় দুটি ধাপ বেশি: গাছটি সেখানে একটি শাখা বেড়ে উঠেছে যেখানে অফারটি চাইছিল।'
