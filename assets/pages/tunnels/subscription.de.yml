page_title: Abonnieren
page_icon: 'ph:bold/credit-card'
intro: 'Ein Abonnement mit zwei Angeboten. Das kostenlose ist ein Konto und nichts weiter; das Pro-Angebot fügt eine Zahlung hinzu, die von einer Bank bestätigt wird, die Demo spielt.'
start: 'Drei Schritte für Kostenlos, fünf für Pro. Jeder Schritt hat eine eigene Seite, auf der unten steht, was der Motor gerade getan hat.'
roads:
  description: 'Der Kontoschritt liest das Angebot, das sein Cursor trägt, um zu entscheiden, was folgt: eine Zahlung für Pro, nichts für Kostenlos. Die beiden Wege sind nicht gleich lang.'
  free: Kostenlos
  paid: Pro
steps:
  offer: 'Hier teilen sich die Wege, und zwar nicht in die gleiche Form: Bis ein Angebot ausgewählt ist, zeigt der Steppprozess eine Lücke, wo sie sich unterscheiden.'
  account: 'Die gleiche Form auf beiden Wegen. Sein Cursor trägt das Angebot, und der Schritt liest es, um zu entscheiden, was folgt.'
  payment: 'Nur auf dem Pro-Weg. Während es angezeigt wird, läuft die Sitzung in 15 Minuten ab, wie ein reservierter Platz; nach der Zahlung kann nichts davor erneut erreicht werden, und es wird nie zweimal angeboten.'
  waiting: 'Die Sitzung wartet auf die Bank. Ein Button der Demo spielt sein Webhook, das die Sitzung durch TunnelResumeService wiederherstellt.'
  welcome: 'Beide Wege enden hier, jeder durch einen eigenen Cursor, und die Sitzung wird geschlossen.'
