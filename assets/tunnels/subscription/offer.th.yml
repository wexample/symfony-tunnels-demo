page_title: การสมัครสมาชิก
title: เลือกข้อเสนอของคุณ
lead: 'สองข้อเสนอ และเส้นทางที่แตกต่างกันสำหรับแต่ละข้อเสนอ: ข้อเสนอ Pro ต้องผ่านการชำระเงิน ขณะที่ข้อเสนอฟรีจะไม่ต้องชำระเงินเลย.'
offer:
  free:
    title: ฟรี
    description: 'บัญชีหนึ่งบัญชี ไม่มีค่าธรรมเนียม สองขั้นตอนก็เข้าถึงได้แล้ว.'
  paid:
    title: Pro
    description: 'บัญชีหนึ่งบัญชีและการชำระเงิน ซึ่งได้รับการยืนยันจากธนาคารก่อนที่คุณจะเข้าถึงได้.'
behind: 'จุดเริ่มต้นแต่ละจุด การ์ดแต่ละใบจะนำไปสู่ตัวชี้ของขั้นตอนบัญชีที่มีข้อเสนอเป็นตัวเลือก และขั้นตอนบัญชีจะอ่านตัวเลือกนั้นเพื่อตัดสินใจในสิ่งที่จะเกิดขึ้นต่อไป: การชำระเงินสำหรับ Pro, ไม่มีอะไรสำหรับฟรี สองสาขานั้นไม่เหมือนกัน ซึ่งเป็นเหตุผลที่ตัวชี้ขั้นตอนจะแสดงช่องว่างหลังจากขั้นตอนบัญชี: จนกว่าคุณจะเลือก ไม่มีใครสามารถบอกได้ว่ามีกี่ขั้นตอนที่เหลือ.'
