page_title: 'डेमो टनल'
title: 'आपका नाम'
lead: 'हमें अंतिम चीज़ की आवश्यकता है।'
behind: 'यह एक फॉर्म स्टेप है। इसे दिखाना पर्याप्त नहीं है: यह केवल तभी किया जाता है जब फॉर्म मान्य हो, और इसके बाद के चरण तब तक पहुंच से बाहर रहते हैं। नाम इस कर्सर पर संग्रहीत होता है। इस चरण पर वापस आएं और यह अभी भी वहाँ है; इससे पहले के चरण पर वापस जाएं और यह मिटा दिया जाता है, क्योंकि पीछे जाना उन चीज़ों को छोड़ देता है जो आगे के चरणों ने संग्रहीत की थी, इसलिए एक बार फिर से चलाए गए शाखा को साफ शुरू किया जाता है।'
