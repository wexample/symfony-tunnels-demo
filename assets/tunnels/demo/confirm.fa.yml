page_title: 'تونل دمو'
title: 'نام شما'
lead: 'آخرین چیزی که به آن نیاز داریم.'
behind: 'یک مرحله فرم. نمایش آن کافی نیست: تنها زمانی انجام می‌شود که فرم معتبر باشد و مراحل بعدی تا آن زمان در دسترس نیستند. نام در این نشانگر ذخیره می‌شود. به این مرحله برگردید و هنوز آنجا است؛ به مرحله‌ای قبل از آن برگردید و پاک می‌شود، زیرا بازگشت به عقب آنچه مراحل بعدی ذخیره کرده‌اند را از بین می‌برد، بنابراین یک شاخه که دوباره پیموده می‌شود، از ابتدا تمیز شروع می‌شود.'
