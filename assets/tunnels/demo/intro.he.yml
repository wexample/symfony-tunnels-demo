page_title: 'מנהרת דמו'
title: 'ברוך הבא'
lead: 'מנהרה קצרה להראות איך קוראים: בחר תכנית, תן שם, וזהו. התכנית שתבחר קובעת את השלב שיבוא אחריה.'
plan:
  free:
    description: 'הכל כדי להתחיל, כלום לשלם.'
  paid:
    description: 'הכול, עם מקום לצמוח.'
behind: 'נקודת הכניסה למנהרה. פתיחתה יצרה סשן במאגר הנתונים, שהסשן בדפדפן יודע עליו רק לפי ה-id שלו. השלב הזה מתבצע ברגע שהוא מוצג, כברירת מחדל. לשתי הכרטיסים מובילים לשני קורסורים של אותו שלב הבא, המובדלים לפי אפשרות התכנית שלהם: העץ מתפצל כאן, כך שאין כפתור הבא, והשמות של השלב הם שלב 2 אחרי השלב במקום אחרי תכנית.'
