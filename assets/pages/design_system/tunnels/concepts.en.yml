page_title: How it works
page_icon: ph:bold/tree-structure
intro: "What the engine is made of, and where to see it at work while walking the demo tunnels."
tree:
  title: A tree of cursors
  body: "A tunnel is built as a tree, not a list. A step reached from two places is two cursors, each with its own hash and its own stored values: that is what lets a branch grow steps another one does not have, and what the way you came, shown at the end of each tunnel, is read from."
session:
  title: A session in the database
  body: "Opening a tunnel creates a session, which the browser session only knows by its id. It holds the values the steps store, and expires a day after the last step shown — or sooner, when that step asks for it. Expired sessions are dropped by the scheduler, every 15 minutes; completed and pending ones are kept."
access:
  title: Where the visitor may go
  body: "Every step decides whether it can be shown and where to send the visitor otherwise. Links and buttons are drawn with the same rules, so a link never leads to a redirect back: no next button where the road parts, no way back past a payment, nothing to go back to in a closed session."
look:
  title: What to look at while walking
  stepper:
    title: The stepper
    body: "Where you stand, what is behind, what is ahead. A gap marks where the road depends on a choice not made yet."
  behind:
    title: Behind this step
    body: "Under every step, what the engine just did, and its state: the cursor, how the step completes, the session and when it expires."
  toolbar:
    title: The develop toolbar and the shell
    body: "The Tunnels tab of the develop toolbar draws the session of this browser on the map of its tunnel; bin/console tunnels:info does the same from a shell."
