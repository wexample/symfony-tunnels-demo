page_title: 'ডেমো টানেল'
title: 'আপনার নাম'
lead: 'আমাদের যা দরকার তা হলো শেষ জিনিসটি।'
behind: 'একটি ফর্ম পদক্ষেপ। এটি প্রদর্শন করা যথেষ্ট নয়: এটি শুধুমাত্র তখনই করা হয় যখন ফর্মটি বৈধ হয়, এবং তার পরবর্তী পদক্ষেপগুলি তখন পর্যন্ত নাগালের বাইরে থাকে। নামটি এই কার্সারে সংরক্ষিত হয়। এই পদক্ষেপে ফিরে আসুন এবং এটি এখনও সেখানে থাকবে; এর আগে একটি পদক্ষেপে ফিরে যান এবং এটি মুছে যাবে, যেহেতু ফিরে যাওয়া এটি পূর্বে সংরক্ষিত পদক্ষেপগুলিকে বাদ দেয়, তাই পুনরায় হাঁটা একটি শাখা পরিষ্কারভাবে শুরু হয়।'
