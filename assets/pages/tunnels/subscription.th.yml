page_title: สมัครสมาชิก
page_icon: 'ph:bold/credit-card'
intro: 'การสมัครสมาชิกมีสองข้อเสนอ ข้อเสนอฟรีคือบัญชีและไม่มีอะไรเพิ่มเติม; ข้อเสนอ Pro จะเพิ่มการชำระเงินที่ยืนยันโดยธนาคารซึ่งการสาธิตแสดงให้เห็น'
start: 'สามขั้นตอนสำหรับฟรี ห้าขั้นตอนสำหรับ Pro เดินไปยังหน้าของมันเอง แต่ละขั้นตอนบอกด้านล่างว่าเครื่องยนต์ทำอะไรไปแล้ว'
roads:
  description: 'ขั้นตอนบัญชีอ่านข้อเสนอที่ตัวชี้ไปถึงเพื่อกำหนดว่าจะเกิดอะไรขึ้นต่อไป: การชำระเงินสำหรับ Pro ไม่มีอะไรสำหรับฟรี สองเส้นทางมีความยาวไม่เท่ากัน'
  free: ฟรี
  paid: Pro
steps:
  offer: 'เส้นทางแยกที่นี่ และไม่ใช่ในรูปแบบเดียวกัน: จนกว่าจะเลือกข้อเสนอ ตัวชี้แสดงช่องว่างที่พวกเขาแตกต่างกัน'
  account: 'รูปแบบเดียวกันในทั้งสองเส้นทาง ตัวชี้ไปถึงข้อเสนอ และขั้นตอนอ่านมันเพื่อตัดสินใจว่าจะเกิดอะไรขึ้นต่อไป'
  payment: 'เฉพาะในเส้นทาง Pro ขณะที่มันแสดงอยู่ เซสชันจะหมดอายุใน 15 นาทีเหมือนที่นั่งที่จองไว้; เมื่อชำระเงินแล้ว ไม่มีอะไรที่อยู่ก่อนหน้านั้นสามารถเข้าถึงได้อีก และจะไม่มีการเสนอสองครั้ง'
  waiting: 'เซสชันรออยู่ที่ธนาคาร ปุ่มของการสาธิตเล่นเว็บฮุคซึ่งทำให้เซสชันกลับมาอีกครั้งผ่าน TunnelResumeService'
  welcome: 'ทั้งสองเส้นทางสิ้นสุดที่นี่ แต่ละเส้นทางผ่านตัวชี้ของมันเอง และเซสชันถูกปิด'
