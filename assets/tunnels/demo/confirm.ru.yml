page_title: 'Демо туннель'
title: 'Ваше имя'
lead: 'Последнее, что нам нужно.'
behind: 'Шаг формы. Его отображение недостаточно: он выполняется только после того, как форма становится валидной, а последующие шаги остаются недоступными до этого момента. Имя хранится на этом курсоре. Вернитесь к этому шагу, и оно все еще будет там; вернитесь к шагу перед ним, и оно будет стерто, так как возврат удаляет то, что шаги впереди хранили, поэтому повторное прохождение ветки начинается с чистого листа.'
