page_title: 'نفق العرض'
title: مرحبًا
lead: 'نفق قصير لإظهار كيفية القراءة: اختر خطة، أعطِ اسمًا، وانتهى الأمر. الخطة التي تختارها تحدد الخطوة التالية.'
plan:
  free:
    description: 'كل ما تحتاجه للبدء، لا شيء للدفع.'
  paid:
    description: 'كل شيء، مع مساحة للنمو.'
behind: 'نقطة دخول النفق. فتحه أنشأ جلسة في قاعدة البيانات، والتي تعرفها جلسة المتصفح فقط من خلال معرفها. تتم هذه الخطوة بمجرد عرضها، وهذا هو الافتراضي. تقود البطاقتان إلى مؤشرين لنفس الخطوة التالية، متميزتين بخيار خطتهما: تتفرع الشجرة هنا، لذلك لا يوجد زر التالي، ويسمى المؤشر الخطوة 2 بعد الخطوة بدلاً من بعد خطة.'
