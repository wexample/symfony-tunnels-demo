page_title: 'ডেমো টানেল'
title: স্বাগতম
lead: 'কিভাবে একটি টানেল পড়া হয় তা দেখানোর জন্য একটি সংক্ষিপ্ত টানেল: একটি পরিকল্পনা বেছে নিন, একটি নাম দিন, এবং হয়ে গেল। আপনি যে পরিকল্পনা বেছে নেন তা পরবর্তী পদক্ষেপ নির্ধারণ করে।'
plan:
  free:
    description: 'শুরু করার জন্য সবকিছু, কোনো খরচ নেই।'
  paid:
    description: 'সম্পূর্ণ বিষয়, বাড়ানোর জন্য জায়গা আছে।'
behind: 'টানেলের প্রবেশপথ। এটি খুললে একটি সেশন তৈরি হয় ডাটাবেজে, যা ব্রাউজার সেশন কেবল তার আইডি দ্বারা জানে। এটি প্রদর্শিত হওয়ার সাথে সাথে পদক্ষেপটি সম্পন্ন হয়, ডিফল্টরূপে। দুটি কার্ড একই পরবর্তী পদক্ষেপের দুটি কার্সরের দিকে নিয়ে যায়, তাদের পরিকল্পনা বিকল্প দ্বারা আলাদা করা হয়: এখানে গাছের অংশ, তাই পরবর্তী বোতাম নেই, এবং স্টেপার পদক্ষেপ 2 নামকরণ করে পদক্ষেপের পরে, পরিকল্পনার পরে নয়।'
