page_title: Abonnement
title: 'Kies je aanbod'
lead: 'Twee aanbiedingen, en een andere weg voor elk: de Pro gaat via een betaling die de gratis nooit ziet.'
offer:
  free:
    title: Gratis
    description: 'Een account, niets te betalen. Twee stappen en je bent binnen.'
  paid:
    title: Pro
    description: 'Een account en een betaling, bevestigd door de bank voordat je binnenkomt.'
behind: 'De toegangspunt. Elke kaart leidt naar een cursor van de accountstap die het aanbod als optie meedraagt, en de accountstap leest die optie om te kiezen wat volgt: een betaling voor Pro, niets voor Gratis. De twee takken zijn niet dezelfde vorm, daarom toont de stappenindicator een gat na de account: totdat je kiest, kan niemand zeggen hoeveel stappen er nog zijn.'
