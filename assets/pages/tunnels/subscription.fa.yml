page_title: عضویت
page_icon: 'ph:bold/credit-card'
intro: 'یک اشتراک با دو پیشنهاد. پیشنهاد رایگان تنها یک حساب کاربری است و هیچ چیز بیشتر؛ پیشنهاد پرو شامل یک پرداخت است که توسط بانکی تأیید می‌شود که دموی آن را اجرا می‌کند.'
start: 'سه مرحله برای رایگان، پنج مرحله برای پرو. هر یک در صفحه‌ای جداگانه قرار دارد و هر کدام در زیر توضیح می‌دهد که موتور چه کاری انجام داده است.'
roads:
  description: 'مرحله حساب، پیشنهاد را که نشانگر آن حمل می‌کند می‌خواند تا تصمیم بگیرد که چه چیزی بعد از آن می‌آید: پرداخت برای پرو، هیچ‌چیز برای رایگان. دو جاده طول یکسانی ندارند.'
  free: رایگان
  paid: پرو
steps:
  offer: 'جاده‌ها در اینجا جدا می‌شوند و به یک شکل یکسان نیستند: تا زمانی که یک پیشنهاد انتخاب نشده، مرحله‌ساز شکاف را نشان می‌دهد که آنها در آن متفاوت هستند.'
  account: 'فرم مشابه در هر دو جاده. نشانگر آن پیشنهاد را حمل می‌کند و مرحله آن را می‌خواند تا تصمیم بگیرد چه چیزی بعد از آن می‌آید.'
  payment: 'فقط در جاده پرو. در حالی که نشان داده می‌شود، جلسه در ۱۵ دقیقه منقضی می‌شود، مانند یک صندلی رزرو شده؛ پس از پرداخت، هیچ‌چیز قبل از آن دوباره قابل دسترسی نیست و هرگز دو بار ارائه نمی‌شود.'
  waiting: 'جلسه منتظر بانک است. دکمه دموی آن وبهوک خود را اجرا می‌کند که جلسه را از طریق TunnelResumeService از سر می‌گیرد.'
  welcome: 'هر دو جاده در اینجا به پایان می‌رسند، هر یک از طریق نشانگر خود، و جلسه بسته می‌شود.'
