page_title: सदस्यता
title: 'अपनी पेशकश चुनें'
lead: 'दो प्रस्ताव, और हर एक के लिए एक अलग रास्ता: प्रो वाला एक भुगतान के माध्यम से जाता है जिसे मुफ्त वाला कभी नहीं देखता।'
offer:
  free:
    title: मुफ्त
    description: 'एक खाता, कुछ भी भुगतान नहीं करना। दो चरण और आप अंदर हैं।'
  paid:
    title: प्रो
    description: 'एक खाता और एक भुगतान, बैंक द्वारा पुष्टि की गई जब आप अंदर आते हैं।'
behind: 'प्रवेश बिंदु। प्रत्येक कार्ड एक खाता चरण के कर्सर की ओर ले जाता है जो पेशकश को एक विकल्प के रूप में ले जाता है, और खाता चरण उस विकल्प को पढ़ता है ताकि यह तय कर सके कि क्या आगे बढ़ना है: प्रो के लिए एक भुगतान, मुफ्त के लिए कुछ नहीं। दोनों शाखाएँ एक ही आकार की नहीं हैं, यही कारण है कि स्टेपर खाता के बाद एक अंतर दिखाता है: जब तक आप चयन नहीं करते, कोई नहीं बता सकता कि कितने चरण बाकी हैं।'
