behind: 'שני הענפים מסתיימים כאן, כל אחד דרך סמן משלו, והצגתו סוגרת את הסשן. הדרך למטה ארוכה בשני צעדים בענף הפרו: העץ צמח ענף היכן שההצעה ביקשה זאת.'
