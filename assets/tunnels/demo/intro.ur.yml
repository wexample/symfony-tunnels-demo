page_title: 'ڈیمو سرنگ'
title: 'خوش آمدید'
lead: 'ایک مختصر سرنگ یہ دکھانے کے لیے کہ کوئی کیسے پڑھتا ہے: ایک منصوبہ منتخب کریں، ایک نام دیں، اور یہ مکمل ہوا۔ آپ کا منتخب کردہ منصوبہ اگلے مرحلے کا تعین کرتا ہے۔'
plan:
  free:
    description: 'شروع کرنے کے لیے سب کچھ، کچھ بھی ادا کرنے کی ضرورت نہیں۔'
  paid:
    description: 'یہ سب کچھ، بڑھنے کی گنجائش کے ساتھ۔'
behind: 'سرنگ کا داخلہ نقطہ۔ اسے کھولنے سے ڈیٹا بیس میں ایک سیشن تخلیق ہوا، جسے براؤزر کا سیشن صرف اس کی شناخت کے ذریعے جانتا ہے۔ یہ مرحلہ جیسے ہی ظاہر ہوتا ہے، مکمل ہو جاتا ہے، یہ ڈیفالٹ ہے۔ دونوں کارڈز ایک ہی اگلے مرحلے کے دو کرسرز کی طرف لے جاتے ہیں، جو اپنے منصوبے کے اختیار سے الگ ہوتے ہیں: درخت کے حصے یہاں ہیں، اس لیے کوئی اگلا بٹن نہیں ہے، اور اسٹیپر مرحلہ 2 کو مرحلے کے بعد نام دیتا ہے نہ کہ منصوبے کے بعد۔'
