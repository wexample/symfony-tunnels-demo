page_title: সাবস্ক্রাইব
page_icon: 'ph:bold/credit-card'
intro: 'দুটি অফারের সাথে একটি সাবস্ক্রিপশন। ফ্রি অফারটি একটি অ্যাকাউন্ট এবং আর কিছুই নয়; প্রো অফারটি একটি পেমেন্ট যোগ করে, যা একটি ব্যাংক দ্বারা নিশ্চিত করা হয় যা ডেমোটি বাজায়।'
start: 'ফ্রি জন্য তিনটি পদক্ষেপ, প্রো জন্য পাঁচটি। প্রতিটি তার নিজস্ব পৃষ্ঠায় চলে, যেখানে নিচে লেখা থাকে ইঞ্জিনটি কী করেছে।'
roads:
  description: 'অ্যাকাউন্ট পদক্ষেপটি সেই অফারটি পড়ে যা এর কার্সর বহন করে যাতে পরবর্তীটি নির্ধারণ করতে পারে: প্রোর জন্য একটি পেমেন্ট, ফ্রি’র জন্য কিছুই নয়। দুইটি রাস্তার দৈর্ঘ্য সমান নয়।'
  free: ফ্রি
  paid: প্রো
steps:
  offer: 'রাস্তা এখানে পৃথক হয়, এবং একই আকারে নয়: একটি অফার পছন্দ না হওয়া পর্যন্ত, স্টেপারটি একটি ফাঁকা স্থান প্রদর্শন করে যেখানে তারা আলাদা।'
  account: 'দুই রাস্তার জন্য একই ফর্ম। এর কার্সর অফারটি বহন করে, এবং পদক্ষেপটি এটি পড়ে পরবর্তীটি নির্ধারণ করে।'
  payment: 'শুধুমাত্র প্রো রাস্তায়। যখন এটি প্রদর্শিত হয়, তখন সেশনটি ১৫ মিনিটে শেষ হয়ে যায়, যেমন একটি সংরক্ষিত আসন; একবার পেমেন্ট হলে, এর আগে কিছুই আবার পৌঁছানো যাবে না, এবং এটি কখনও দ্বিগুণভাবে অফার করা হয় না।'
  waiting: 'সেশনটি ব্যাংকে অপেক্ষা করছে। একটি বোতাম ডেমোটি এর ওয়েবহুক বাজায়, যা টানেলরিজিউমসার্ভিসের মাধ্যমে সেশনটি পুনরায় চালু করে।'
  welcome: 'উভয় রাস্তা এখানে শেষ হয়, প্রতিটি তার নিজস্ব কার্সরের মাধ্যমে, এবং সেশনটি বন্ধ হয়ে যায়।'
