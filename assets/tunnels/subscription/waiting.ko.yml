page_title: 구독
title: '은행을 기다리는 중'
lead: '결제 %reference%가 전송되었습니다. 은행에서 시간이 걸려 확인합니다.'
note:
  title: '이 페이지를 떠날 수 있습니다'
  body: '결제는 어떤 조치를 취하더라도 유지됩니다: 나중에 다시 오면 은행이 응답할 때 입장이 허용됩니다.'
behind: '세션이 pending_async_action 상태입니다: 터널을 걷고 있는 누구도 이 단계를 완료할 수 없으며, 오직 은행만 가능합니다. 실제 애플리케이션은 웹후크에서 응답을 받고 참조를 TunnelResumeService에 전달하여 대기 세션의 터널을 재구성하고 이 단계를 완료합니다; 다시 표시되면, 이 단계는 방문자를 스스로 이동시킵니다. 아래 버튼은 은행의 역할을 합니다. 대기 중인 세션은 만료되지 않으며, 결제 이전의 것은 더 이상 연결되지 않습니다.'
simulate: '은행을 조작합니다: 결제를 확인합니다'
