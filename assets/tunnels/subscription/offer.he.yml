page_title: מנוי
title: 'בחר את ההצעה שלך'
lead: 'שתי הצעות, וכל אחת בדרך שונה: ההצעה המקצועית עוברת דרך תשלום שהחינמית לא רואה לעולם.'
offer:
  free:
    title: חינם
    description: 'חשבון, אין תשלום. שני צעדים ואתה בפנים.'
  paid:
    title: פרו
    description: 'חשבון ותשלום, מאושר על ידי הבנק לפני שתיכנס.'
behind: 'נקודת הכניסה. כל כרטיס מוביל לסמן של שלב החשבון נושא את ההצעה כאפשרות, ושלב החשבון קורא לאפשרות הזו כדי לבחור מה יקרה בהמשך: תשלום עבור פרו, כלום עבור חינם. שני הענפים אינם באותו צורה, ולכן המדריך מראה פער אחרי החשבון: עד שתבחר, אף אחד לא יכול לדעת כמה צעדים נותרו.'
