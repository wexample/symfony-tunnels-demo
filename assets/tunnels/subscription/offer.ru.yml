page_title: Подписка
title: 'Выберите ваше предложение'
lead: 'Два предложения, и разный путь для каждого: платное идет через оплату, бесплатное никогда этого не увидит.'
offer:
  free:
    title: Бесплатно
    description: 'Аккаунт, ничего не нужно платить. Два шага, и вы внутри.'
  paid:
    title: Профессиональный
    description: 'Аккаунт и оплата, подтвержденная банком перед входом.'
behind: 'Точка входа. Каждая карточка ведет к курсору шага аккаунта, содержащего предложение в качестве варианта, и шаг аккаунта читает этот вариант, чтобы определить, что будет дальше: оплата для Профессионального, ничего для Бесплатного. Два пути не одинаковой формы, поэтому индикатор показывает пробел после аккаунта: пока вы не выберете, никто не может сказать, сколько шагов осталось.'
