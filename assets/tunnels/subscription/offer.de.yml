page_title: Abonnement
title: 'Wählen Sie Ihr Angebot'
lead: 'Zwei Angebote, und ein unterschiedlicher Weg für jedes: das Pro-Angebot erfordert eine Zahlung, die das kostenlose niemals sieht.'
offer:
  free:
    title: Kostenlos
    description: 'Ein Konto, nichts zu zahlen. Zwei Schritte und Sie sind drin.'
  paid:
    title: Pro
    description: 'Ein Konto und eine Zahlung, die von der Bank bestätigt wird, bevor Sie eintreten.'
behind: 'Der Einstiegspunkt. Jede Karte führt zu einem Cursor des Kontoschritts, der das Angebot als Option trägt, und der Kontoschritt liest diese Option, um zu bestimmen, was folgt: eine Zahlung für Pro, nichts für Kostenlos. Die beiden Zweige haben nicht die gleiche Form, weshalb der Stepper eine Lücke nach dem Konto zeigt: bis Sie wählen, kann niemand sagen, wie viele Schritte noch übrig sind.'
