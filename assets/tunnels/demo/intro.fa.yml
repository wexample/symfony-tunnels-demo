page_title: 'تونل دموی'
title: 'خوش آمدید'
lead: 'تونل کوتاهی برای نشان دادن نحوه خواندن: یک طرح انتخاب کنید، یک نام بدهید و تمام. طرحی که انتخاب می‌کنید مرحله بعدی را تعیین می‌کند.'
plan:
  free:
    description: 'همه‌چیز برای شروع، هیچ هزینه‌ای ندارد.'
  paid:
    description: 'همه چیز، با فضایی برای رشد.'
behind: 'نقطه ورودی تونل. باز کردن آن یک جلسه در پایگاه داده ایجاد کرد که جلسه مرورگر تنها با شناسه‌اش آن را می‌شناسد. این مرحله به محض نمایش داده شدن انجام می‌شود، به‌طور پیش‌فرض. دو کارت به دو نشانگر مرحله بعدی یکسان منتهی می‌شوند که با گزینه طرحشان از هم متمایز شده‌اند: درخت‌ها در اینجا قسمت‌ها را تشکیل می‌دهند، بنابراین دکمه بعدی وجود ندارد و نام‌گذاری مرحله‌نما در مرحله ۲ بعد از مرحله به جای یک طرح است.'
