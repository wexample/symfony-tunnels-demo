page_title: מנהרות
page_icon: 'ph:bold/path'
intro: 'מנהרה היא מסע המנוקד בשלבים — הרשמה, תשלום, חידוש — כאשר הדרך יכולה להשתנות לפי מה שהמבקר עונה. החבילה זוכרת היכן עומד כל מבקר, מאפשרת להם לעבור את השלבים שהם עשויים לראות, ושולחת אותם חזרה למקום שאליו הם שייכים כאשר הם מנסים לדלג קדימה.'
card:
  plan:
    title: 'בחר תוכנית'
    description: 'המנהרה הראשונה: שני סניפים, טופס, ומפגש נסגר בסוף.'
  subscription:
    title: הירשם
    description: 'תשלום בסניף אחד בלבד, מפגש שנמשך 15 דקות, המתנה בבנק.'
tree:
  title: 'עץ של סמנים'
  body: 'מנהרה נבנית כמו עץ, לא כמו רשימה. שלב המגיע משני מקומות הוא שני סמנים, כל אחד עם ההאש שלו ועם הערכים השמורים שלו: זה מה שמאפשר לסניף לגדול בשלבים שאין לאחרים, ומהדרך שבה הגעת, המוצגת בסוף כל מנהרה, נקראת.'
session:
  title: 'מפגש במסד הנתונים'
  body: 'פתיחת מנהרה יוצרת מפגש, שדפדפן המפגש מכיר רק לפי ה-id שלו. הוא מחזיק את הערכים שהשלבים שומרים, ומסתיים יום לאחר השלב האחרון שהוצג — או קודם לכן, כאשר השלב הזה מבקש זאת. מפגשים שפג תוקפם נמחקים על ידי המתז, כל 15 דקות; מפגשים שהושלמו וממתינים נשמרים.'
access:
  title: 'לאן המבקר יכול ללכת'
  body: 'כל שלב קובע אם ניתן להציג אותו ואיפה לשלוח את המבקר אחרת. קישורים וכפתורים מצויירים באותם כללים, כך שקישור לעולם לא מוביל להפניה חזרה: אין כפתור הבא כאשר הדרך מתפצלת, אין דרך חזרה לאחר תשלום, אין מה לחזור אליו במפגש סגור.'
look:
  title: 'מה להסתכל עליו בזמן ההליכה'
  stepper:
    title: המדריך
    body: 'איפה אתה עומד, מה יש מאחור, מה יש קדימה. פער מסמן היכן הדרך תלויה בבחירה שעדיין לא נעשתה.'
  behind:
    title: 'מאחורי שלב זה'
    body: 'מתחת כל שלב, מה שהמנוע עשה זה עתה, ומצבו: הסמן, איך השלב מתממש, המפגש ומתי הוא פג תוקף.'
  toolbar:
    title: 'סרגל הכלים של המפתחים והמעטפת'
    body: 'לשונית המנהרות בסרגל הכלים של המפתחים מציגה את המפגש של דפדפן זה על המפה של המנהרה שלו; bin/console tunnels:info עושה את אותו הדבר מהמעטפת.'
