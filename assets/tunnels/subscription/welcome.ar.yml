page_title: الاشتراك
title: مرحبا
lead:
  free: 'حسابك المجاني جاهز.'
  paid: 'تم تأكيد الدفع، حسابك الاحترافي جاهز.'
path:
  title: 'الطريق الذي جئت منه'
behind: 'تنتهي كلا الفرعين هنا، كل منهما عبر مؤشر خاص به، وعرضه يغلق الجلسة. الطريق أدناه أطول بخطوتين على الفرع الاحترافي: لقد نمت الشجرة فرعًا حيث طلب العرض ذلك.'
