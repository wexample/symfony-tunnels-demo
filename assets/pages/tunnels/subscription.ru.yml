page_title: Подписка
page_icon: 'ph:bold/credit-card'
intro: 'Подписка с двумя предложениями. Бесплатное - это аккаунт и ничего больше; Про - это платное предложение, подтвержденное банком, с которым работает демонстрация.'
start: 'Три шага для Бесплатной, пять для Про. Каждый из них имеет свою страницу, где ниже рассказывается, что сделала система.'
roads:
  description: 'Шаг аккаунта читает предложение, которое несет его курсор, чтобы решить, что будет дальше: оплата для Про, ничего для Бесплатной. Два пути не одинаковой длины.'
  free: Бесплатно
  paid: Про
steps:
  offer: 'Дороги расходятся здесь, и не в одном направлении: пока не выбрано предложение, индикатор показывает пробел, где они различаются.'
  account: 'Одна и та же форма на обоих путях. Его курсор несет предложение, и шаг читает его, чтобы решить, что будет дальше.'
  payment: 'Только на пути Про. Пока он показывается, сессия истекает через 15 минут, как забронированное место; после оплаты к нему нельзя вернуться, и оно никогда не предлагается дважды.'
  waiting: 'Сессия ждет ответа от банка. Кнопка демонстрации активирует вебхук, который возобновляет сессию через TunnelResumeService.'
  welcome: 'Обе дороги заканчиваются здесь, каждая через свой курсор, и сессия закрыта.'
