page_title: Abonelik
title: Ödeme
lead: 'Pro, ayda 9 €. Doldurulacak bir şey yok: ödemeye basmak, bir kart girişi anlamına gelir.'
behind: 'Pro dalının sadece bir adımı. Gösterildiği süre boyunca, oturum 15 dakikada sona erer, bir gün yerine, ayrılmış bir koltuk gibi: aşağıdaki sona erme süresine bakın. Ödeme, bankanın geri göndereceği bir referans saklar, oturumu pending_async_action durumuna getirir ve devam eder. O andan itibaren, bu adım, önceki adımlara erişimi yasaklar ve bir daha asla sunulmaz.'
