page_title: سبسکرپشن
title: 'اپنی پیشکش منتخب کریں'
lead: 'دو پیشکشیں ہیں، اور ہر ایک کے لیے ایک مختلف راستہ: پرو کی پیشکش میں ادائیگی کی ضرورت ہوتی ہے جبکہ مفت کی پیشکش میں یہ کبھی نہیں ہوتی۔'
offer:
  free:
    title: مفت
    description: 'ایک اکاؤنٹ، کوئی ادائیگی نہیں۔ دو مراحل اور آپ اندر ہیں۔'
  paid:
    title: پرو
    description: 'ایک اکاؤنٹ اور ایک ادائیگی، جو آپ کے اندر جانے سے پہلے بینک کی طرف سے تصدیق شدہ ہے۔'
behind: 'داخلے کا نقطہ۔ ہر کارڈ اکاؤنٹ کے مرحلے کی طرف ایک کرسر کی طرف جاتا ہے جو پیشکش کو بطور انتخاب لے کر جاتا ہے، اور اکاؤنٹ کا مرحلہ اس انتخاب کو پڑھتا ہے تاکہ یہ منتخب کرے کہ کیا آگے بڑھے: پرو کے لیے ایک ادائیگی، مفت کے لیے کچھ نہیں۔ دونوں شاخیں ایک جیسی شکل کی نہیں ہیں، یہی وجہ ہے کہ اسٹیپر اکاؤنٹ کے بعد ایک خالی جگہ دکھاتا ہے: جب تک آپ منتخب نہیں کرتے، کوئی نہیں بتا سکتا کہ کتنے مراحل باقی ہیں۔'
