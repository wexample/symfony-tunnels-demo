page_title: Subscribe
page_icon: ph:bold/credit-card
intro: "A subscription with two offers. The free one is an account and nothing more; the Pro one adds a payment, confirmed by a bank the demo plays."
start:
  title: Walk the tunnel
  description: Three steps for Free, five for Pro. Under each one, a panel tells what the engine just did.
roads:
  title: Its two roads
  description: "The account step reads the offer its cursor carries to decide what follows: a payment for Pro, nothing for Free. The two roads are not the same length."
  free: Free
  paid: Pro
steps:
  offer: "The roads part here, and not into the same shape: until an offer is picked, the stepper shows a gap where they differ."
  account: "The same form on both roads. Its cursor carries the offer, and the step reads it to decide what follows."
  payment: "On the Pro road only. While it is shown, the session expires in 15 minutes, as a reserved seat would; once paid, nothing before it can be reached again, and it is never offered twice."
  waiting: "The session waits on the bank. A button of the demo plays its webhook, which resumes the session through TunnelResumeService."
  welcome: "Both roads end here, each through a cursor of its own, and the session is closed."
