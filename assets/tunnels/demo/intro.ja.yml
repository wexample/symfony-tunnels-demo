page_title: デモトンネル
title: ようこそ
lead: どのように読むかを示す短いトンネルです：プランを選び、名前を付け、完了です。選んだプランが次のステップを決定します。
plan:
  free:
    description: 始めるためのすべて、支払いは不要です。
  paid:
    description: すべてを含み、成長の余地があります。
behind: トンネルの入り口です。これを開くことでデータベースにセッションが作成され、ブラウザセッションはそのIDでのみ知っています。このステップは表示されるとすぐに完了し、デフォルトです。2つのカードは同じ次のステップの2つのカーソルに導き、プランオプションによって区別されます：ここではツリーが分かれているので次へ進むボタンはなく、ステッパーはプランではなくステップに基づいてステップ2と名付けます。
