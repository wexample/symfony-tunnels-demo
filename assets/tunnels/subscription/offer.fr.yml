page_title: Abonnement
title: 'Choisissez votre offre'
lead: 'Deux offres, et une route différente pour chacune : la Pro passe par un paiement que la gratuite ne voit jamais.'
offer:
  free:
    title: Gratuit
    description: 'Un compte, rien à payer. Deux étapes et vous êtes dedans.'
  paid:
    title: Pro
    description: "Un compte et un paiement, confirmé par la banque avant d'entrer."
behind: "Le point d'entrée. Chaque carte mène à un curseur de l'étape de compte portant l'offre comme option, et l'étape de compte lit cette option pour choisir ce qui suit : un paiement pour Pro, rien pour Gratuit. Les deux branches n'ont pas la même forme, c'est pourquoi le sélecteur montre un vide après le compte : jusqu'à ce que vous choisissiez, personne ne peut dire combien d'étapes il reste."
