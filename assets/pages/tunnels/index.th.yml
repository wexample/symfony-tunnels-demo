page_title: อุโมงค์
page_icon: 'ph:bold/path'
intro: 'อุโมงค์คือการเดินทางที่ตัดเป็นขั้นตอน — การลงทะเบียน, การชำระเงิน, การต่ออายุ — ซึ่งเส้นทางสามารถเปลี่ยนได้ตามคำตอบของผู้เข้าชม แพ็คเกจจะจดจำว่าผู้เข้าชมแต่ละคนอยู่ที่ไหน ช่วยให้พวกเขาผ่านขั้นตอนที่พวกเขาอาจเห็น และส่งพวกเขากลับไปยังที่ที่พวกเขาควรอยู่เมื่อพวกเขาพยายามข้ามไปข้างหน้า.'
card:
  plan:
    title: เลือกแผน
    description: 'อุโมงค์แรก: สองสาขา, แบบฟอร์ม, และเซสชันที่ปิดเมื่อสิ้นสุด.'
  subscription:
    title: สมัครสมาชิก
    description: 'การชำระเงินในสาขาเดียว, เซสชันที่ใช้เวลา 15 นาที, รอธนาคาร.'
tree:
  title: ต้นไม้ของเคอร์เซอร์
  body: 'อุโมงค์ถูกสร้างขึ้นเป็นต้นไม้ ไม่ใช่รายการ ขั้นตอนที่เข้าถึงจากสองที่คือเคอร์เซอร์สองตัว แต่ละตัวมีแฮชและค่าที่จัดเก็บของตัวเอง: นั่นคือสิ่งที่ทำให้สาขาเติบโตขั้นตอนที่อีกสาขาไม่มี และสิ่งที่คุณมาถึง แสดงที่ปลายอุโมงค์แต่ละแห่ง ถูกอ่านจากที่นั่น.'
session:
  title: เซสชันในฐานข้อมูล
  body: 'การเปิดอุโมงค์จะสร้างเซสชัน ซึ่งเซสชันของเบราว์เซอร์จะรู้จักเพียงด้วย id ของมัน มันเก็บค่าที่ขั้นตอนจัดเก็บ และหมดอายุหนึ่งวันหลังจากขั้นตอนสุดท้ายที่แสดง — หรือเร็วกว่านั้นเมื่อขั้นตอนนั้นขอให้หมดอายุ เซสชันที่หมดอายุจะถูกลบโดยผู้จัดกำหนดการ ทุก 15 นาที; เซสชันที่เสร็จสมบูรณ์และรออยู่จะถูกเก็บไว้.'
access:
  title: ที่ที่ผู้เข้าชมอาจไป
  body: 'ทุกขั้นตอนตัดสินใจว่าจะแสดงได้หรือไม่และจะส่งผู้เข้าชมไปที่ใดอีก ลิงก์และปุ่มถูกวาดด้วยกฎเดียวกัน ดังนั้นลิงก์จึงไม่เคยนำไปสู่การเปลี่ยนเส้นทางกลับ: ไม่มีปุ่มถัดไปเมื่อเส้นทางแยกออก ไม่มีทางกลับหลังการชำระเงิน ไม่มีอะไรที่จะกลับไปในเซสชันที่ปิด.'
look:
  title: สิ่งที่จะดูขณะเดิน
  stepper:
    title: ตัวเดินขั้นตอน
    body: 'ที่ที่คุณยืน, สิ่งที่อยู่ข้างหลัง, สิ่งที่อยู่ข้างหน้า ช่องว่างบ่งบอกว่าเส้นทางขึ้นอยู่กับการเลือกที่ยังไม่ได้ทำ.'
  behind:
    title: เบื้องหลังขั้นตอนนี้
    body: 'ใต้ทุกขั้นตอนคือสิ่งที่เครื่องยนต์เพิ่งทำ และสถานะของมัน: เคอร์เซอร์, วิธีที่ขั้นตอนเสร็จสิ้น, เซสชันและเมื่อมันหมดอายุ.'
  toolbar:
    title: แถบเครื่องมือพัฒนาและเชลล์
    body: 'แท็บอุโมงค์ในแถบเครื่องมือพัฒนาจะแสดงเซสชันของเบราว์เซอร์นี้บนแผนที่ของอุโมงค์ของมัน; bin/console tunnels:info ทำเช่นเดียวกันจากเชลล์.'
