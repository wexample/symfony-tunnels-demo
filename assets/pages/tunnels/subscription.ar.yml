page_title: اشترك
page_icon: 'ph:bold/credit-card'
intro: 'اشتراك مع عرضين. العرض المجاني هو حساب ولا شيء أكثر؛ بينما العرض الاحترافي يضيف دفعة، مؤكدة من قبل بنك العرض التوضيحي.'
start: 'ثلاث خطوات للمجاني، وخمس للاحترافي. كل واحدة لها صفحة خاصة بها، وكل واحدة تخبر أدناه بما فعله المحرك للتو.'
roads:
  description: 'خطوة الحساب تقرأ العرض الذي يحمله المؤشر لتحديد ما يلي: دفعة للاحترافي، ولا شيء للمجاني. الطريقتان ليستا بنفس الطول.'
  free: مجاني
  paid: احترافي
steps:
  offer: 'تتفرق الطرق هنا، وليس بنفس الشكل: حتى يتم اختيار عرض، يظهر العداد فجوة حيث تختلف.'
  account: 'نفس النموذج على كلا الطريقتين. يحمل مؤشّرها العرض، وتقرأ الخطوة ذلك لتحديد ما يلي.'
  payment: 'على طريق الاحترافي فقط. أثناء عرضه، تنتهي الجلسة في 15 دقيقة، كما لو كانت مقعدًا محجوزًا؛ بمجرد الدفع، لا يمكن الوصول إلى أي شيء قبله مرة أخرى، ولا يتم عرضه مرتين.'
  waiting: 'الجلسة تنتظر على البنك. زر العرض التوضيحي يقوم بتشغيل webhook الخاص به، الذي يستأنف الجلسة من خلال TunnelResumeService.'
  welcome: 'تنتهي كلا الطريقتين هنا، كل واحدة من خلال مؤشر خاص بها، وتغلق الجلسة.'
