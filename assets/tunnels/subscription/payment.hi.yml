page_title: सदस्यता
title: भुगतान
lead: 'प्रो, प्रति माह €9। भरने के लिए कुछ नहीं: भुगतान करने का मतलब कार्ड दर्ज करना है।'
behind: 'प्रो शाखा का केवल एक चरण। जबकि यह दिखाया गया है, सत्र 15 मिनट में समाप्त हो जाता है, एक दिन के बजाय, जिस तरह से एक सुरक्षित सीट होगी: नीचे समाप्ति देखें। भुगतान एक संदर्भ को संग्रहीत करता है जो बैंक वापस भेजेगा, सत्र को pending_async_action पर सेट करता है और आगे बढ़ता है। तब से, यह चरण पहले किसी भी चीज़ तक पहुँचने की अनुमति नहीं देता है, और इसे फिर से कभी पेश नहीं किया जाता है।'
