page_title: "S'abonner"
page_icon: 'ph:bold/carte-de-crédit'
intro: 'Un abonnement avec deux offres. La gratuite est un compte et rien de plus ; la Pro ajoute un paiement, confirmé par une banque que la démo joue.'
start: 'Trois étapes pour la version gratuite, cinq pour la version Pro. Chacune a sa propre page, et chacune explique ci-dessous ce que le moteur vient de faire.'
roads:
  description: "L'étape du compte lit l'offre que son curseur porte pour décider de la suite : un paiement pour Pro, rien pour Free. Les deux routes n'ont pas la même longueur."
  free: Gratuit
  paid: Pro
steps:
  offer: "Les routes se séparent ici, et pas de la même manière : tant qu'une offre n'est pas choisie, le sélecteur montre un vide où elles diffèrent."
  account: "Le même formulaire sur les deux routes. Son curseur porte l'offre, et l'étape la lit pour décider de la suite."
  payment: "Uniquement sur la route Pro. Pendant qu'il est affiché, la session expire dans 15 minutes, comme un siège réservé ; une fois payé, rien avant cela ne peut être atteint à nouveau, et il n'est jamais proposé deux fois."
  waiting: 'La session attend la banque. Un bouton de la démo joue son webhook, qui reprend la session via TunnelResumeService.'
  welcome: 'Les deux routes se terminent ici, chacune par un curseur qui lui est propre, et la session est clôturée.'
