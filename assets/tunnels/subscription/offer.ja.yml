page_title: サブスクリプション
title: オファーを選択
lead: 2つのオファー、それぞれ異なる道があります：プロは支払いを伴い、無料はそれを必要としません。
offer:
  free:
    title: 無料
    description: アカウント、支払いは不要。2ステップで開始できます。
  paid:
    title: プロ
    description: アカウントと支払い、入会前に銀行によって確認されます。
behind: エントリーポイント。各カードは、オファーを選択肢として持つアカウントステップのカーソルに繋がっています。アカウントステップはその選択肢を読み取り、次に何を選ぶかを決定します：プロの場合は支払い、無料の場合は何もありません。2つの枝は同じ形ではありません。そのため、ステッパーはアカウントの後に隙間を表示します：選択するまで、残りのステップ数は誰にもわかりません。
