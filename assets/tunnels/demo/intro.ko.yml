page_title: '데모 터널'
title: 환영합니다
lead: '어떻게 진행하는지 보여주는 짧은 터널: 계획을 선택하고, 이름을 입력하면 완료됩니다. 선택한 계획이 다음 단계의 내용을 결정합니다.'
plan:
  free:
    description: '시작하기 위한 모든 것, 비용은 없습니다.'
  paid:
    description: '모든 기능을 포함하며, 성장할 여지가 있습니다.'
behind: '터널의 진입점입니다. 이를 열면 데이터베이스에 세션이 생성되며, 브라우저 세션은 오직 ID로만 이를 인식합니다. 이 단계는 표시되자마자 완료되며, 기본값입니다. 두 카드가 동일한 다음 단계의 두 커서를 안내하며, 계획 옵션에 따라 구분됩니다: 여기서는 분기하므로 다음 버튼이 없고, 단계 이름은 계획이 아닌 단계에 따라 2단계로 표시됩니다.'
